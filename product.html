<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartWatch Pro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: rgb(230, 245, 255);
    }
    header {
      text-align: center;
      padding: 20px;
      background-color: rgb(0, 123, 255);
      color: rgb(255, 255, 255);
    }
    .container {
      width: 90%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }
    .product-box {
      background-color: rgb(255, 255, 255);
      padding: 20px;
      border: 2px solid rgb(0, 123, 255);
      border-radius: 8px;
      margin-bottom: 20px;
    }
    button {
      background-color: rgb(255, 165, 0);
      color: rgb(255, 255, 255);
      border: none;
      padding: 12px 20px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
      margin-top: 10px;
    }
    button:hover {
      background-color: rgb(255, 140, 0);
    }
    form {
      background-color: rgb(255, 255, 255);
      padding: 20px;
      border: 2px solid rgb(0, 150, 136);
      border-radius: 8px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid rgb(150, 150, 150);
      border-radius: 5px;
    }
    label {
      font-weight: bold;
    }
  </style>
</head>

<input type="email" id="email" placeholder="Enter your email" required>

<label>

</label>

  </form></div></body>
</html>
